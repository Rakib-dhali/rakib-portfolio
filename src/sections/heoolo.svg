                dur="2.6s"
                repeatCount="indefinite"
                begin="0s"
              />
              <animate
                attributeName="opacity"
                values="0.45;0"
                dur="2.6s"
                repeatCount="indefinite"
                begin="0s"
              />
            </circle>

            <circle
              cx="160"
              cy="240"
